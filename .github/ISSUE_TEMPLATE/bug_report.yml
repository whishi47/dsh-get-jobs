name: 🐛 Bug 反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索是否已有同类 issue。
        日志和截图请先脱敏：不要包含 Cookie、API Key、简历内容或公司内部信息。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象 + 报错信息（有日志请贴关键片段）
      placeholder: 点击「开始投递」后状态一直是「启动中」，日志里出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「运行」页
        2. 选择 Boss 直聘
        3. 点击「开始投递」
        4. ……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 设置页顶部或 package.json 里的版本号
      placeholder: 0.12.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      options:
        - Boss直聘
        - 猎聘
        - 51job
        - 智联招聘
        - 多个 / 与平台无关
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Node 22 / JDK 21 / DSH 0.2.1
  - type: textarea
    id: logs
    attributes:
      label: 日志（已脱敏）
      description: 设置页「诊断日志」或 target/logs/get-jobs.log 的相关片段
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 日志与截图已脱敏（不含 Cookie / API Key / 简历内容）
          required: true
