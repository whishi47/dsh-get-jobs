name: ✨ 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述你遇到的问题，再给方案——这样更容易判断该不该做、怎么做。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述使用场景与痛点，不要直接跳到实现方案
      placeholder: 每天要手动切换四个平台看投递结果，希望有一个汇总页……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 新平台支持
        - 投递流程 / 配额
        - AI / 简历
        - 界面 / 交互
        - 配置 / 部署
        - 通知 / 推送
        - 其它
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
